name: Teleprompter
options:
  bundleIdPrefix: pl.klaudiamichnik
  deploymentTarget:
    iOS: "17.0"
targets:
  Teleprompter:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Teleprompter
        UILaunchScreen: {}
        UIBackgroundModes: [audio] # „Audio, AirPlay i Obraz w Obrazie” — wymagane przez PiP
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Mikrofon słucha, co czytasz, i przesuwa tekst (tryb „Przewijaj za głosem”). Dźwięk nie jest zapisywany.
        NSSpeechRecognitionUsageDescription: Rozpoznawanie mowy pozwala przesuwać tekst w tempie Twojego czytania.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
